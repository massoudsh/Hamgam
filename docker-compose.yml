name: hamgam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamgam}
      POSTGRES_USER: ${POSTGRES_USER:-hamgam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamgam}
    volumes:
      - hamgam-db:/var/lib/postgresql/data
    ports:
      # Exposed only to the host for debugging; the API reaches the DB over the compose network.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hamgam}:${POSTGRES_PASSWORD:-hamgam}@db:5432/${POSTGRES_DB:-hamgam}
      PORT: "4000"
      # Migrations are idempotent (IF NOT EXISTS), so applying them at boot is safe.
      AUTO_MIGRATE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing API URL; baked into the bundle at image build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hamgam-db:
